version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 15

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    # let new releases settle before they are proposed (supply-chain risk)
    cooldown:
      default-days: 7
    ignore:
      # @types/node follows the minimum supported Node.js version (engines >= 22), not the latest
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # major updates of the toolchain need manual migration
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
